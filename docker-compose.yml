version: '3.8'

services:
  immich-job-daemon:
    # Use pre-built image from GitHub Container Registry
    image: ghcr.io/alternativniy/immich-job-daemon:latest
    # Or build locally by uncommenting the line below and commenting out the image line
    # build: .
    container_name: immich-job-daemon
    restart: unless-stopped
    environment:
      - IMMICH_URL=http://127.0.0.1:2283
      - API_KEY=your_api_key_here
      - MAX_CONCURRENT_JOBS=1
      - POLL_INTERVAL=10
      - STRICT_LIMIT=true
      - IDLE_POLICY=resume
      # Optional: override queue list / priority (space or comma separated)
      # - MANAGED_QUEUES=library sidecar metadataExtraction storageTemplateMigration thumbnailGeneration smartSearch faceDetection ocr facialRecognition duplicateDetection videoConversion migration
    depends_on:
      - immich-server
    networks:
      - immich_network
